<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#245c45">
  <meta name="description" content="查閱幼兒園教保活動課程大綱六大領域與各年齡層學習指標，快速複製、整理教學指標。">
  <title>幼兒園教保活動課程大綱 - 學習指標</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/styles.css?v=20261012-4">
  <script src="assets/app.js?v=20261012-4" defer></script>
</head>
<body>
  <a class="skip-link" href="#app">跳至學習指標</a>
  <div class="workspace">
    <div class="workspace-layout">
      <aside class="sidebar" aria-label="領域與年齡篩選">
        <header class="site-header">
          <div class="brand-logo"><img src="assets/wentzao-logo.webp" alt="文藻美語 WENTZAO SCHOOL" width="1250" height="1667"></div>
          <div class="brand-title">
            <h1>學習指標</h1>
            <p>幼兒園教保活動課程大綱</p>
          </div>
        </header>
        <div class="sidebar-filters">
          <section class="sidebar-panel domain-panel" aria-labelledby="domainFilterTitle">
            <h2 class="sidebar-title" id="domainFilterTitle">學習領域</h2>
            <nav class="domain-nav" id="domainLinks" aria-label="學習領域"></nav>
            <div class="mobile-domain-field">
              <label class="sr-only" for="domainNav">跳至學習領域</label>
              <select class="nav-select" id="domainNav" disabled><option>領域載入中…</option></select>
            </div>
          </section>
          <section class="sidebar-panel age-panel" aria-labelledby="ageFilterTitle">
            <h2 class="sidebar-title" id="ageFilterTitle">年齡</h2>
            <div class="age-controls" id="ageFilters" role="group" aria-label="年齡篩選"></div>
          </section>
        </div>
      </aside>
      <div class="page-shell">
        <main id="app" tabindex="-1" aria-label="學習指標內容">
          <p class="status-message" role="status">資料載入中…</p>
        </main>
        <noscript><p class="status-message">請啟用 JavaScript 以查閱學習指標。</p></noscript>
        <p class="site-footer">幼兒園教保活動課程大綱 · 六大領域學習指標</p>
      </div>
    </div>
  </div>
  <div class="floating-toolbar" role="region" aria-label="指標工具列">
    <button class="clipboard-btn" id="clipboardBtn" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
      <span>已複製 <span class="badge" id="clipboardCount">0</span></span>
    </button>
  </div>
  <dialog class="clipboard-modal" id="clipboardModal" aria-labelledby="clipboardTitle">
    <div class="modal-header">
      <h2 id="clipboardTitle">已複製的指標</h2>
      <button class="modal-close" id="closeClipboardBtn" type="button" aria-label="關閉已複製的指標" autofocus>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <ul class="clipboard-list" id="clipboardList"></ul>
    <div class="clipboard-actions">
      <button class="clipboard-action-btn copy-all-btn" id="copyAllBtn" type="button" disabled>全部複製</button>
      <button class="clipboard-action-btn clear-btn" id="clearBtn" type="button" disabled>清空</button>
    </div>
  </dialog>
  <dialog class="confirm-modal" id="confirmModal" aria-labelledby="confirmTitle" aria-describedby="confirmDescription">
    <h2 id="confirmTitle">清空已複製的指標？</h2>
    <p id="confirmDescription">這會清空本頁的指標清單。</p>
    <div class="clipboard-actions">
      <button class="clipboard-action-btn clear-btn" id="confirmCancel" type="button" autofocus>取消</button>
      <button class="clipboard-action-btn copy-all-btn" id="confirmClear" type="button">確定清空</button>
    </div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <p class="sr-only" id="filterStatus" role="status" aria-live="polite"></p>
</body>
</html>
